<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence Intake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171C8F'/%3E%3Cpath d='M10 9h12v3H13.5v3.5H21v3h-7.5V23H10z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="rail" id="rail" aria-label="Main navigation">
      <a class="brand" href="#/intake" aria-label="Evidence Intake home">
        <span class="mark" aria-hidden="true">fm</span>
        <span class="brand-text lbl">
          <span class="wm"><span class="wm-a">forvis</span> <span class="wm-b">mazars</span></span>
          <span class="product">Evidence Intake</span>
        </span>
      </a>

      <nav class="nav" id="nav">
        <span class="nav-hover" aria-hidden="true"></span>
        <span class="nav-active" aria-hidden="true"></span>
        <a href="#/intake" data-view="intake" style="--i:0">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M6 4h12l2 9v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6z"/></svg>
          <span class="lbl">Intake</span><span class="count" id="nav-intake"></span>
        </a>
        <a href="#/queue" data-view="queue" style="--i:1">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
          <span class="lbl">Review queue</span><span class="count" id="nav-pending"></span>
        </a>
        <a href="#/requests" data-view="requests" style="--i:2">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>
          <span class="lbl">Client requests</span><span class="count" id="nav-requests"></span>
        </a>
        <a href="#/audit" data-view="audit" style="--i:3">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
          <span class="lbl">Audit trail</span>
        </a>
        <a href="#/register" data-view="register" style="--i:4">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
          <span class="lbl">Governance</span>
        </a>
        <a href="#/results" data-view="results" style="--i:5">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></svg>
          <span class="lbl">Results</span>
        </a>
      </nav>

      <div class="rail-foot">
        <div class="label lbl">Acting as</div>
        <div class="personas" id="personas"></div>
        <div class="rail-actions">
          <button class="rail-btn" id="tour-btn" type="button" title="Take the tour">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10.5 8.5l5 3.5-5 3.5z"/></svg>
            <span class="lbl">Take the tour</span>
          </button>
          <button class="rail-btn" id="reset" type="button" title="Reset demo data">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5"/><path d="M5.5 15a7 7 0 1 0 1.6-7.4L4 10"/></svg>
            <span class="lbl">Reset demo data</span>
          </button>
          <button class="rail-btn" id="pin" type="button" aria-pressed="false" title="Keep the sidebar open">
            <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            <span class="lbl">Keep open</span>
          </button>
        </div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="peek" id="peek" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
