<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence Intake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171C8F'/%3E%3Cpath d='M10 9h12v3H13.5v3.5H21v3h-7.5V23H10z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/intake" aria-label="Evidence Intake home">
        <span class="wm"><span class="wm-a">forvis</span><span class="wm-b">mazars</span></span>
        <span class="product">Evidence Intake</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/intake" data-view="intake"><span class="n">01</span>Intake</a>
        <a href="#/queue" data-view="queue"><span class="n">02</span>Review queue <span class="count" id="nav-pending"></span></a>
        <a href="#/audit" data-view="audit"><span class="n">03</span>Audit trail</a>
        <a href="#/register" data-view="register"><span class="n">04</span>Register</a>
        <a href="#/results" data-view="results"><span class="n">05</span>Results</a>
      </nav>
      <div class="side-foot">
        <div class="label">Acting as</div>
        <div class="personas" id="personas"></div>
        <div class="side-links">
          <button class="linkish" id="tour-btn">Take the tour</button>
          <button class="linkish" id="reset">Reset demo data</button>
        </div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
